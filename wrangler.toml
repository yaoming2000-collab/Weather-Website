# Cloudflare Worker：天气站（weather.itsfunmag.com）
name = "weather-itsfunmag"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# 先打包浏览器脚本（public/static/app.js）
[build]
command = "npm run build:client"

# 静态文件（图标、法律页面、ads.txt 等）。存在的文件直接由 Cloudflare 返回，不经过 Worker。
[assets]
directory = "./public"
# 保持旧网址原样可用（如 /en/term-of-use.html），不做去掉 .html 的跳转
html_handling = "none"

# 天气数据的全局缓存（第二层缓存）。部署前用 `wrangler kv namespace create WEATHER_KV` 创建，把 id 填到这里。
[[kv_namespaces]]
binding = "WEATHER_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# 猜一猜计数和排行榜（第 3 步）。部署前：
#   npx wrangler d1 create weather-features                         # 把输出的 database_id 填到这里
#   npx wrangler d1 migrations apply weather-features --remote      # 建表（migrations/ 目录）
[[d1_databases]]
binding = "DB"
database_name = "weather-features"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

# 定时任务：每天 03:17（UTC）清理过期的猜一猜计数（保留 7 天）和排行榜数据（保留 2 天）
[triggers]
crons = ["17 3 * * *"]

# 城市搜索的频率限制：每个 IP 每 60 秒最多 30 次（每次搜索都向 Foreca 计费，防止机器人消耗额度）。
# 计数按 Cloudflare 机房分别统计。需要 wrangler 4.36 或更新版本。
[[ratelimits]]
name = "SEARCH_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 30
  period = 60

[vars]
# foreca = 调用真实接口（需要 FORECA_TOKEN 密钥）；mock = 使用模拟数据（开发、预览用）
WEATHER_PROVIDER = "foreca"

# 密钥不要写在这里，用命令设置：wrangler secret put FORECA_TOKEN

# ---------------------------------------------------------------------------
# 测试环境（预览用）：npx wrangler deploy --env preview
# 使用模拟数据，不需要 Foreca 密钥，也不需要创建 KV 和 D1：
#   数据缓存自动退回每个机房各自的缓存；猜一猜和排行榜退回内存（Worker 重启后清零，预览够用）。
# 部署后的地址：https://weather-itsfunmag-preview.<你的账号子域名>.workers.dev
# 详细步骤见 docs/deploy-preview.md
# ---------------------------------------------------------------------------
[env.preview]
name = "weather-itsfunmag-preview"

# 测试环境也用真实 Foreca 时，同样限制搜索频率（绑定不会从上面继承）
[[env.preview.ratelimits]]
name = "SEARCH_LIMITER"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

[env.preview.vars]
WEATHER_PROVIDER = "mock"

# 如需使用公司域名（itsfunmag.com 已托管在 Cloudflare 时），取消下面两行的注释：
# [[env.preview.routes]]
# pattern = "weather-next.itsfunmag.com"
# custom_domain = true
